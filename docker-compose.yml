version: "3.9"

services:
  backend:
    build: ./xoflix_backend
    container_name: xoflix_backend
    command: gunicorn xoflix_backend.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - ./xoflix_backend:/app
    ports:
      - "8000:8000"
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: xoflix_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

  db:
    image: mysql:8.0.36-debian
    platform: linux/amd64
    container_name: xoflix_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: xoflix
      MYSQL_USER: xoflix
      MYSQL_PASSWORD: xoflix
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  nginx:
    image: nginx:1.25.3
    container_name: xoflix_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./frontend:/usr/share/nginx/html
    depends_on:
      - backend
      - frontend

volumes:
  mysql_data: